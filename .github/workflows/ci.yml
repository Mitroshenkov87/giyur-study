name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # PR refs look like "1/merge"; keep the file name path-safe.
          $ref = "${{ github.ref_name }}" -replace '[\\/]', '-'
          Copy-Item target/release/shorashim.exe "dist/Shorashim-$ref-windows-x64.exe"
          Copy-Item LICENSE, NOTICE dist/
          # Portable zip: exe + music playlist + licenses (the lone exe has no music).
          $portable = "dist/Shorashim-$ref-windows-x64"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target/release/shorashim.exe "$portable/Shorashim.exe"
          Copy-Item LICENSE, NOTICE $portable/
          if (Test-Path assets/music) {
            Copy-Item assets/music $portable/music -Recurse
          }
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Shorashim-windows-x64
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorashim-${{ github.ref_name }}-windows-x64.exe
            dist/Shorashim-${{ github.ref_name }}-windows-x64.zip
            dist/LICENSE
            dist/NOTICE

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev libasound2-dev pkg-config
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release
