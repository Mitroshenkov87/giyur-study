name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Automation smoke (release exe, headless script)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/shorashim.exe -ArgumentList '--headless','--script','tests/scripts/01-navigate.jsonl','--today','2026-11-22' -Wait -NoNewWindow -PassThru -RedirectStandardOutput smoke.jsonl -RedirectStandardError smoke.err
          Get-Content smoke.jsonl
          if ($p.ExitCode -ne 0) { Get-Content smoke.err; exit 1 }
          if ((Get-Content smoke.jsonl).Count -lt 10) { Write-Error "too few replies"; exit 1 }
      - name: Automation smoke (console companion shorashim-ctl.exe)
        shell: pwsh
        run: |
          target/release/shorashim-ctl.exe --headless --script tests/scripts/02-lesson.jsonl --today 2026-11-22
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # PR refs look like "1/merge"; keep the file name path-safe.
          $ref = "${{ github.ref_name }}" -replace '[\\/]', '-'
          Copy-Item target/release/shorashim.exe "dist/Shorashim-$ref-windows-x64.exe"
          Copy-Item target/release/shorashim-ctl.exe dist/
          Copy-Item LICENSE, NOTICE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Shorashim-windows-x64
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorashim-${{ github.ref_name }}-windows-x64.exe
            dist/LICENSE
            dist/NOTICE

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release
      - name: Automation smoke (release binary, headless script)
        run: target/release/shorashim --headless --script tests/scripts/01-navigate.jsonl --today 2026-11-22
