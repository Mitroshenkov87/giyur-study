name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Automation smoke (release exe, headless script)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/shorashim.exe -ArgumentList '--headless','--script','tests/scripts/01-navigate.jsonl','--today','2026-11-22' -Wait -NoNewWindow -PassThru -RedirectStandardOutput smoke.jsonl -RedirectStandardError smoke.err
          Get-Content smoke.jsonl
          if ($p.ExitCode -ne 0) { Get-Content smoke.err; exit 1 }
          if ((Get-Content smoke.jsonl).Count -lt 10) { Write-Error "too few replies"; exit 1 }
      - name: Automation smoke (console companion shorashim-ctl.exe)
        shell: pwsh
        run: |
          target/release/shorashim-ctl.exe --headless --script tests/scripts/02-lesson.jsonl --today 2026-11-22
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Course content is valid (content/<lang>/, read at run time)
        run: target/release/shorashim-ctl.exe validate-content content
      - name: Language content parity (content/en vs content/ru)
        run: target/release/shorashim-ctl.exe validate-parity content
      - name: Package Shorashim-Setup.exe (stub + app + content/ + music)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python tools/make_setup.py --stub target/release/shorashim-setup.exe `
            --exe target/release/shorashim.exe --ctl target/release/shorashim-ctl.exe `
            --content content --music assets/music --extra LICENSE NOTICE `
            --out dist/Shorashim-Setup.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/make_setup.py --list dist/Shorashim-Setup.exe
      - name: Setup smoke (install, then run the installed copy with its content/)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Shorashim-Setup.exe -ArgumentList '--quiet','--no-launch' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "setup failed ($($p.ExitCode))"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Shorashim'
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $dir 'content\ru\manifest.json'))) { Write-Error "no content in $dir"; exit 1 }
          if (-not (Test-Path (Join-Path $dir 'content\en\manifest.json'))) { Write-Error "no English content in $dir"; exit 1 }
          # With no folder given the installed copy must pick content\ beside itself.
          $out = & (Join-Path $dir 'shorashim-ctl.exe') validate-content
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          if (-not ($out -like "*$dir*")) { Write-Error "installed copy did not use $dir\content"; exit 1 }
          & (Join-Path $dir 'shorashim-ctl.exe') --headless --script tests/scripts/02-lesson.jsonl --today 2026-11-22
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Shorashim-Setup
          path: dist/Shorashim-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorashim-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release (Apple Silicon and Intel)
        run: |
          cargo build --release --bin shorashim --target aarch64-apple-darwin
          cargo build --release --bin shorashim --target x86_64-apple-darwin
      - name: Universal binary (lipo)
        run: |
          mkdir -p dist
          lipo -create -output dist/shorashim \
            target/aarch64-apple-darwin/release/shorashim \
            target/x86_64-apple-darwin/release/shorashim
          lipo -info dist/shorashim
      - name: Package Shorashim.app and Shorashim-macOS.dmg
        run: tools/make_macos_app.sh dist/shorashim dist
      - name: Bundle smoke (the app finds content/ in Contents/Resources)
        run: |
          app=dist/Shorashim.app/Contents/MacOS/shorashim
          out=$("$app" validate-content)
          echo "$out"
          echo "$out" | grep -q "Shorashim.app/Contents/Resources/content" || { echo "bundle did not use its Resources/content"; exit 1; }
          "$app" --headless --script tests/scripts/01-navigate.jsonl --today 2026-11-22 > smoke.jsonl
          wc -l smoke.jsonl
          test "$(wc -l < smoke.jsonl)" -ge 10
          "$app" --headless --script tests/scripts/02-lesson.jsonl --today 2026-11-22 > /dev/null
      - name: Headless screenshot from the bundle
        run: |
          mkdir -p shots
          printf '%s\n' \
            '{"cmd":"press","label":"Начать","expect":{"screen":"level"}}' \
            '{"cmd":"press","contains":"Ортодоксальный","expect":{"screen":"map"}}' \
            "{\"cmd\":\"screenshot\",\"path\":\"$PWD/shots/macos-lessons.webp\"}" > shot.jsonl
          dist/Shorashim.app/Contents/MacOS/shorashim --headless --script shot.jsonl --today 2026-11-22
          ls -l shots
      - name: Mount the dmg and run the copy inside
        run: |
          hdiutil attach dist/Shorashim-macOS.dmg -mountpoint /tmp/shorashim-dmg -nobrowse
          /tmp/shorashim-dmg/Shorashim.app/Contents/MacOS/shorashim validate-content
          hdiutil detach /tmp/shorashim-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Shorashim-macOS
          path: dist/Shorashim-macOS.dmg
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: shots/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorashim-macOS.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev libasound2-dev pkg-config
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release
      - name: Course content is valid (content/<lang>/, read at run time)
        run: target/release/shorashim-ctl validate-content content
      - name: Language content parity (content/en vs content/ru)
        run: target/release/shorashim-ctl validate-parity content
      - name: Automation smoke (release binary, headless script)
        run: target/release/shorashim --headless --script tests/scripts/01-navigate.jsonl --today 2026-11-22
