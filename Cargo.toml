[package]
name = "shorashim"
version = "0.5.1"
edition = "2021"
authors = ["Aleksandr Mitroshenkov"]
rust-version = "1.88"
description = "Shorashim (Шорашим): foundations of Judaism and preparation for giyur, a Russian-language offline study app (native Rust desktop app)"
license = "Apache-2.0"
readme = "README.md"
build = "build.rs"

[lib]
name = "shorashim"
path = "src/lib.rs"

[[bin]]
name = "shorashim"
path = "src/main.rs"

# Console companion for automation on Windows (the main exe is a GUI program,
# so shells don't wait for it). See docs/AUTOMATION.md.
[[bin]]
name = "shorashim-ctl"
path = "src/bin/shorashim-ctl.rs"

[dependencies]
iced = { version = "0.14", features = ["image", "tiny-skia", "wgpu", "tokio", "canvas", "advanced"] }
# Headless widget tree for the automation probe (same version as iced).
iced_runtime = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["webp"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "vorbis"] }

[dev-dependencies]
# Headless layout of real screens in tests (same version as iced).
iced_runtime = "0.14"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["webp", "ico", "png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
